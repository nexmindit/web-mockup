<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เพิ่มข้อมูลรุ่นรถ | ระบบจัดการสต็อกรถ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">
  <header class="bg-slate-900 text-white px-6 lg:px-12 py-6">
    <div class="max-w-5xl mx-auto flex items-start justify-between gap-6">
      <div>
        <p class="text-sm text-slate-300 uppercase tracking-wide">โมดูลข้อมูลหลัก</p>
        <h1 class="text-3xl font-semibold tracking-tight mt-1">เพิ่มข้อมูลรุ่นรถ</h1>
        <p class="text-slate-200 text-sm mt-2">
          จัดเก็บรายละเอียดรุ่นรถ สี ออปชัน และราคาต้นทุนสำหรับใช้ในสต็อกและการขาย
        </p>
      </div>
      <a href="../index.html#master-data" class="hidden sm:inline-flex items-center gap-2 rounded-xl border border-white/20 px-4 py-2 text-sm font-semibold text-white hover:bg-white/10 transition">
        ← กลับคลังรุ่นรถ
      </a>
    </div>
  </header>

  <main class="flex-1 py-10 px-4">
    <div class="max-w-5xl mx-auto space-y-8">
      <nav class="flex flex-wrap items-center gap-2 text-sm text-slate-500">
        <a href="../index.html" class="hover:text-slate-700">หน้าหลัก</a>
        <span>/</span>
        <a href="../index.html#master-data" class="hover:text-slate-700">ข้อมูลหลัก</a>
        <span>/</span>
        <span class="text-slate-900 font-semibold">เพิ่มข้อมูลรุ่นรถ</span>
      </nav>

      <section class="bg-white border border-slate-200 rounded-xl p-6 lg:p-8 space-y-8">
        <div class="flex items-center justify-between gap-4">
          <div>
            <h2 class="text-xl font-semibold text-slate-900">รายละเอียดรุ่นรถ</h2>
            <p class="text-sm text-slate-500 mt-1">กำหนดข้อมูลพื้นฐานและรายละเอียดทางเทคนิคให้ครบถ้วน</p>
          </div>
          <button class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">คัดลอกจากรุ่นเดิม</button>
        </div>

        <form class="space-y-8">
          <div class="grid gap-6 md:grid-cols-2">
            <div class="space-y-2">
              <label for="brand" class="text-sm font-semibold text-slate-700">ยี่ห้อ</label>
              <input id="brand" type="text" placeholder="เช่น Toyota" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>
            <div class="space-y-2">
              <label for="model" class="text-sm font-semibold text-slate-700">รุ่น</label>
              <input id="model" type="text" placeholder="เช่น Fortuner 2.8V" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>
            <div class="space-y-2">
              <label for="year" class="text-sm font-semibold text-slate-700">ปีรุ่น (Model Year)</label>
              <input id="year" type="number" placeholder="2024" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
            </div>
            <div class="space-y-2">
              <label for="body-type" class="text-sm font-semibold text-slate-700">ประเภทรถ</label>
              <select id="body-type" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <option>เลือกประเภทรถ</option>
                <option>SUV</option>
                <option>SEDAN</option>
                <option>PICKUP</option>
                <option>MPV</option>
              </select>
            </div>
          </div>

          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-slate-900">สีและออปชัน</h3>
            <div class="grid gap-6 md:grid-cols-3">
              <div class="space-y-2">
                <label for="primary-color" class="text-sm font-semibold text-slate-700">สีมาตรฐาน</label>
                <input id="primary-color" type="text" placeholder="Pearl White" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              </div>
              <div class="space-y-2">
                <label for="secondary-color" class="text-sm font-semibold text-slate-700">สีพิเศษ</label>
                <input id="secondary-color" type="text" placeholder="Attitude Black" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              </div>
              <div class="space-y-2">
                <label for="color-note" class="text-sm font-semibold text-slate-700">หมายเหตุสี</label>
                <input id="color-note" type="text" placeholder="+15,000 บาทสำหรับสีพิเศษ" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              </div>
            </div>
            <div class="space-y-2">
              <label for="option" class="text-sm font-semibold text-slate-700">ออปชันหลัก</label>
              <textarea id="option" rows="3" placeholder="ระบบความปลอดภัย, ชุดแต่ง, ระบบ Infotainment ฯลฯ" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
            </div>
          </div>

          <div class="grid gap-6 md:grid-cols-2">
            <div class="space-y-2">
              <label for="engine" class="text-sm font-semibold text-slate-700">เครื่องยนต์ / ระบบขับเคลื่อน</label>
              <textarea id="engine" rows="3" placeholder="เครื่องยนต์ 2.8 ลิตร ดีเซล, เกียร์อัตโนมัติ 6 สปีด, ขับเคลื่อน 4 ล้อ" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
            </div>
            <div class="space-y-2">
              <label for="dimension" class="text-sm font-semibold text-slate-700">มิติและน้ำหนัก</label>
              <textarea id="dimension" rows="3" placeholder="ความยาว 4,795 มม., ความกว้าง 1,855 มม., ความสูง 1,835 มม., น้ำหนัก 2,050 กก." class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
            </div>
          </div>

          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-slate-900">ข้อมูลราคาและต้นทุน</h3>
            <div class="grid gap-6 md:grid-cols-3">
              <div class="space-y-2">
                <label for="msrp" class="text-sm font-semibold text-slate-700">ราคาขายปลีกแนะนำ (บาท)</label>
                <input id="msrp" type="number" placeholder="1465000" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              </div>
              <div class="space-y-2">
                <label for="cost" class="text-sm font-semibold text-slate-700">ราคาทุนมาตรฐาน (บาท)</label>
                <input id="cost" type="number" placeholder="1329000" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              </div>
              <div class="space-y-2">
                <label for="target-margin" class="text-sm font-semibold text-slate-700">เป้าหมาย Margin (%)</label>
                <input id="target-margin" type="number" placeholder="12" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              </div>
            </div>
            <div class="space-y-2">
              <label for="campaign-note" class="text-sm font-semibold text-slate-700">หมายเหตุด้านราคา/แคมเปญ</label>
              <textarea id="campaign-note" rows="3" placeholder="เชื่อมโยงกับแคมเปญ Summer SUV Boost, ส่วนลดสำหรับ Fleet 30,000 บาทต่อคัน" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
            </div>
          </div>

          <div class="space-y-2">
            <label for="model-notes" class="text-sm font-semibold text-slate-700">บันทึกเพิ่มเติม</label>
            <textarea id="model-notes" rows="4" placeholder="เอกสารประกอบ, Checklist การส่งมอบ, ความต้องการอะไหล่ หรือคำเตือนจากผู้ผลิต" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
          </div>

          <div class="flex flex-wrap justify-end gap-3">
            <a href="../index.html#master-data" class="rounded-xl border border-slate-200 px-5 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50">ยกเลิก</a>
            <button type="button" class="rounded-xl border border-indigo-200 px-5 py-2.5 text-sm font-semibold text-indigo-600 hover:bg-indigo-50">บันทึกและเพิ่มสีเพิ่มเติม</button>
            <button type="submit" class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow hover:bg-indigo-500">บันทึกข้อมูลรุ่นรถ</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
